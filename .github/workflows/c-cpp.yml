name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Configure CMake
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compiling
        run: cmake --build build --config Release

      - name: Run
        run: ./build/mygit